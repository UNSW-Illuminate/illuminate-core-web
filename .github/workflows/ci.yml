name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Audit dependencies
        run: npm run audit:dependencies

      - name: Build
        run: npm run build
        env:
          # The build only needs these to exist; admin auth fails closed without
          # them, and real values live in the deployment environment.
          ADMIN_USER: ci
          ADMIN_PASSWORD: ci
          ADMIN_SESSION_SECRET: ci-build-secret
